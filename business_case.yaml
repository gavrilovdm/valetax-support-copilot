# Inputs of docs/BUSINESS_CASE.md. Edit and run `uv run copilot business-case`.
# The page shows what the system costs to run: measured tokens per ticket × list prices × volume.
# Operator savings are not estimated: they need Valetax's own operator cost and handling time.

volumes: [10000, 50000, 100000]     # tickets/month; 10k from the brief, the rest for growth

llm:
  cache_hit_rate: 0.80              # assumption: ~14 tickets/hour keeps the 5-min cache mostly warm
                                    # in working hours, cold at night

rollout:
  shadow_weeks: 2                   # drafts generated for every ticket but not shown (ADR-016)

configs:                            # candidates; quality and token cost come from the eval reports
  - claude-opus-5-5
  - claude-sonnet-5-5
  - claude-haiku-5-5
  - deepseek-flash
